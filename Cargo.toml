[workspace]
members = ["crates/core", "crates/cli", "crates/web"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.89"
repository = "https://github.com/fontanierh/monopoly-deal-engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
